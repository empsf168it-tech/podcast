<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181428"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- Orbital Signal Waves -->
  <path d="M12 28 A 20 20 0 0 1 52 28" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M18 31 A 14 14 0 0 1 46 31" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M23 34 A 9 9 0 0 1 41 34" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Podcast Microphone Base -->
  <!-- Mic Capsule -->
  <rect x="27" y="16" width="10" height="18" rx="5" fill="url(#glowGrad)" filter="url(#neonGlow)"/>
  
  <!-- Capsule Grill Line -->
  <line x1="27" y1="24" x2="37" y2="24" stroke="#060609" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="36" y2="20" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- U-Shaped Cradle -->
  <path d="M22 27 C 22 36, 42 36, 42 27" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mic Stand Stem -->
  <line x1="32" y1="36" x2="32" y2="44" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mic Stand Base -->
  <line x1="24" y1="44" x2="40" y2="44" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Live Signal Dot -->
  <circle cx="32" cy="51" r="2.5" fill="#00f2fe" filter="url(#neonGlow)"/>
</svg>
